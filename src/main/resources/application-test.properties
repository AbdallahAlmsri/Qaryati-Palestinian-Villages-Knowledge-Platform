# Used by automated tests. The database comes from Testcontainers, so there are no datasource settings.
app.jwt.secret=test-only-secret-test-only-secret-test-only-secret-test-only-secret-0123456789

# Many tests register users from the same address, so the login limit is raised
app.rate-limit.auth.max-requests=1000

# Points at a closed local port so no test can ever call the real geocoding service
app.geocoding.base-url=http://localhost:9