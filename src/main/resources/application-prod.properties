# Production-like settings. Every secret must come from the environment.
# There are deliberately NO defaults: if one is missing, the application refuses to start.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

app.jwt.secret=${APP_JWT_SECRET}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

logging.level.root=INFO
logging.level.com.qaryati=INFO

# Never send internal details to clients
server.error.include-message=never
server.error.include-stacktrace=never