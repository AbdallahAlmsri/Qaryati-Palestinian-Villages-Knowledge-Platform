spring.application.name=qaryati
spring.datasource.url=jdbc:postgresql://localhost:5544/qaryati
spring.datasource.username=${DB_USERNAME:qaryati_user}
spring.datasource.password=${DB_PASSWORD:change_me_locally}
app.jwt.secret=Abtb3bWljz1o9sj58LGMgRBvpsIQEayv
app.jwt.expiration-ms=3600000

app.geocoding.base-url=https://nominatim.openstreetmap.org
app.geocoding.country-codes=ps

resilience4j.retry.instances.nominatim.max-attempts=3
resilience4j.retry.instances.nominatim.wait-duration=1s

resilience4j.circuitbreaker.instances.nominatim.sliding-window-size=10
resilience4j.circuitbreaker.instances.nominatim.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.nominatim.wait-duration-in-open-state=30s

spring.cache.cache-names=geocodeResults
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=24h

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.rate-limit.auth.max-requests=${APP_RATE_LIMIT_AUTH_MAX_REQUESTS:10}
app.rate-limit.auth.window-seconds=${APP_RATE_LIMIT_AUTH_WINDOW_SECONDS:60}