app.geocoding.connect-timeout-ms=${APP_GEOCODING_CONNECT_TIMEOUT_MS:3000}
app.geocoding.read-timeout-ms=${APP_GEOCODING_READ_TIMEOUT_MS:5000}
app.geocoding.rate-limit-ms=${APP_GEOCODING_RATE_LIMIT_MS:1000}

# Geocoding cache (ADR 006): entries expire after a day, at most 1000 are kept
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=24h

# Retry and circuit breaker for the Nominatim client (docs/geocoding-hardening.md)
resilience4j.retry.instances.nominatim.max-attempts=3
resilience4j.retry.instances.nominatim.wait-duration=1s
resilience4j.retry.instances.nominatim.ignore-exceptions=io.github.resilience4j.circuitbreaker.CallNotPermittedException
resilience4j.circuitbreaker.instances.nominatim.sliding-window-size=10
resilience4j.circuitbreaker.instances.nominatim.minimum-number-of-calls=6
resilience4j.circuitbreaker.instances.nominatim.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.nominatim.wait-duration-in-open-state=30s
