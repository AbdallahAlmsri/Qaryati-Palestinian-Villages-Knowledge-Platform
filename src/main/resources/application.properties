$path = "src/main/resources/application.properties"
$content = Get-Content $path -Raw
$lines = @(
    app.geocoding.connect-timeout-ms=${APP_GEOCODING_CONNECT_TIMEOUT_MS:3000}
    app.geocoding.read-timeout-ms=${APP_GEOCODING_READ_TIMEOUT_MS:5000}
    app.geocoding.rate-limit-ms=${APP_GEOCODING_RATE_LIMIT_MS:1000}
)
foreach ($line in $lines) {
    $key = $line.Split('=')[0]
    if ($content -notmatch "(?m)^$([regex]::Escape($key))=") {
        $content = $content.TrimEnd() + "rn" + $line + "rn"
    }
}
[System.IO.File]::WriteAllText(
    (Resolve-Path $path).Path,
    $content,
    (New-Object System.Text.UTF8Encoding($false))
)
