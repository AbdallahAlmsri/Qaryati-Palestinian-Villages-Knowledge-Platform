spring.application.name=qaryati

# Profile used when none is chosen (for example when you press Run in IntelliJ)
spring.profiles.default=dev

# Do not keep a database connection open while the response is being written
spring.jpa.open-in-view=false

# Login tokens last one hour unless APP_JWT_EXPIRATION_MS says otherwise
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}

# External geocoding provider (docs/geocoding-hardening.md)
app.geocoding.base-url=${APP_GEOCODING_BASE_URL:https://nominatim.openstreetmap.org}
app.geocoding.country-codes=ps
app.geocoding.connect-timeout-ms=${APP_GEOCODING_CONNECT_TIMEOUT_MS:3000}
app.geocoding.read-timeout-ms=${APP_GEOCODING_READ_TIMEOUT_MS:5000}
app.geocoding.rate-limit-ms=${APP_GEOCODING_RATE_LIMIT_MS:1000}

# Retry and circuit breaker for the Nominatim client: 3 attempts one second apart; the circuit opens after
# 6 recorded calls with at least half failing and stays open for 30 seconds
resilience4j.retry.instances.nominatim.max-attempts=3
resilience4j.retry.instances.nominatim.wait-duration=1s
resilience4j.retry.instances.nominatim.ignore-exceptions=io.github.resilience4j.circuitbreaker.CallNotPermittedException
resilience4j.circuitbreaker.instances.nominatim.sliding-window-size=10
resilience4j.circuitbreaker.instances.nominatim.minimum-number-of-calls=6
resilience4j.circuitbreaker.instances.nominatim.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.nominatim.wait-duration-in-open-state=30s

# Geocoding cache (ADR 006): entries expire after a day, at most 1000 are kept
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=24h

# Browser origins allowed to call the API (the prod profile requires APP_CORS_ALLOWED_ORIGINS)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Login rate limit per IP address
app.rate-limit.auth.max-requests=${APP_RATE_LIMIT_AUTH_MAX_REQUESTS:10}
app.rate-limit.auth.window-seconds=${APP_RATE_LIMIT_AUTH_WINDOW_SECONDS:60}

# Put the correlation id on every log line
logging.pattern.level=%5p [cid=%X{correlationId:-none}]
