services:
  db:
    image: postgres:16
    container_name: qaryati-db
    environment:
      POSTGRES_DB: qaryati
      POSTGRES_USER: qaryati_user
      POSTGRES_PASSWORD: change_me_locally
    ports:
      - "5544:5432"
    volumes:
      - qaryati_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qaryati_user -d qaryati"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: qaryati-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/qaryati
      DB_USERNAME: qaryati_user
      DB_PASSWORD: change_me_locally
      APP_JWT_SECRET: this-is-a-temporary-local-only-secret-change-it-before-production-use-12345
      APP_JWT_EXPIRATION_MS: 3600000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  qaryati_pgdata: