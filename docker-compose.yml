services:
  db:
    image: postgres:16
    container_name: qaryati-db
    environment:
      POSTGRES_DB: ${DB_NAME:-qaryati}
      POSTGRES_USER: ${DB_USERNAME:?Copy .env.example to .env first}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "${DB_PORT:-5544}:5432"
    volumes:
      - qaryati_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME:-qaryati}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: qaryati-app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-qaryati}
      DB_USERNAME: ${DB_USERNAME:?Copy .env.example to .env first}
      DB_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env first}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in .env}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  qaryati_pgdata: